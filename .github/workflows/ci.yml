name: CI

# This workflow calls the shared job chain in UAMS-Web/uams-ci-workflows and adds the jobs that
# chain does not provide, plus the one job a ruleset requires, `CI`. The chain (Composer validate,
# synced files, no-emoji, aggregate-needs, Pint, Rector, PHPStan, mutate-ignore, mutate, Pest) lives
# in that repository; its checks report as `checks / <job name> (<operating system>)`. The
# `.claude/skills/code-quality/templates/ci.yml` template in UAMS-Web/uams-claude-skills is the
# form this file adopts (UAMS-Web/uams-claude-skills#487). The jobs below the call are this
# repository's own: they are not in the chain, so they stay here as plain jobs. When a job's
# command changes here, change the matching `composer` script (and the other way round).
#
# THE PIN. `uses:` names a release tag of the reusable workflow, never a branch, so a change to
# the chain reaches this repository only when the tag here moves. Dependabot does not move it.
# The inputs: `linux-only: true` keeps every chain job on ubuntu-latest, as this workflow ran
# before the call; `mutate-paths: src` is the path `composer mutate` covers.
#
# REQUIRED CHECKS. The organization ruleset for this repository requires three contexts: `CI`,
# `Attribution footer` and `Closing keywords`. No other job name is required, so renaming or
# adding a job needs no ruleset change. Do not rename `CI`. Job names must stay unique across all
# workflows in this repository, because two jobs under one name report one check.
#
# THE `CI` AGGREGATE. The last job, `ci` (named `CI`), `needs:` the call and every plain job in
# this file, runs `if: always()`, and fails unless each one succeeded (a `skipped` or `cancelled`
# job fails it). The call's own `Chain result` job needs every job in the chain, so the call is
# `success` only when each of them succeeded. Adding, renaming or removing a plain job here means
# changing the `needs:` list of `CI` in the same change: a job left out of it is required by
# nothing. The chain's `aggregate-needs` job runs `check-aggregate-needs.mjs`, which fails, naming
# the job, when the list and the jobs drift apart. A job can only `needs:` jobs in its own
# workflow, so the aggregate lives here and not in the synced `synced-checks.yml`.

on:
  pull_request:
  push:
    branches: [main]
  # Lets the workflow be run on demand against a branch.
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared chain. Its checks report as `checks / <job name> (<operating system>)`.
  checks:
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.2.0
    with:
      linux-only: true
      mutate-paths: src

  # Not in the chain: the repository's decision log has an order a person can break by hand.
  decision-log:
    name: Decision log order
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the two entries, when docs/DECISIONS.md is out of order.
      - run: node scripts/check-decision-log-order.mjs

  scripts:
    name: Guard-script tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # `@statamic/cms` is a `file:` link into `vendor/statamic/cms`, so `npm ci` needs Composer's
      # install first.
      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Node 22 bundles npm 10.9.x, below the `engines.npm` floor that `.npmrc`'s
      # engine-strict enforces, so `npm ci` refuses to run without this pin.
      - name: Pin npm to the engines floor
        run: npm install -g npm@^11.10.0

      - run: npm ci
      - run: npm run test:scripts

  built-assets:
    name: Built assets (resources/dist matches source)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Pin npm to the engines floor
        run: npm install -g npm@^11.10.0

      - run: npm ci

      # The built files are committed, because a Composer install does not run npm. A fresh
      # build that differs from what is committed means the sources changed without a rebuild.
      - run: npm run build
      - name: Fail if the committed build is out of date
        run: |
          changes=$(git status --porcelain -- resources/dist)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::resources/dist differs from a fresh build. Run npm run build and commit the result."
            exit 1
          fi

  parallel-safe:
    name: Parallel-safe tests (no shared state)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      # Dependency-free, so it needs PHP and nothing else.
      - run: composer test:parallel-safe

  # The add-on promises `statamic/cms` at its `composer.json` constraint and PHP ^8.4, and every
  # job above runs one combination. These legs run the dependency-sensitive checks (Larastan and
  # Pest) against the others:
  #   - lowest: the lowest `statamic/cms` the constraint allows, with the dependencies it needs
  #     pulled to their lowest, so an API newer than the declared floor fails here.
  #   - php85: the locked dependencies on PHP 8.5.
  # The lowest bound is derived from the constraint in `composer.json`, never written here, so
  # raising the floor (when code starts to need a newer `statamic/cms` API) moves this leg with it.
  # Check names carry no version number for the same reason: the ruleset's list stays stable.
  # Only the `statamic/cms` dependency closure is lowered; the dev tooling stays locked. The
  # update rewrites `composer.lock` in the runner only.
  compatibility:
    name: Compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lowest statamic/cms
            php: '8.4'
            lowest: true
          - name: PHP 8.5
            php: '8.5'
            lowest: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          php-version: ${{ matrix.php }}

      - name: Lower statamic/cms and its dependencies to their lowest allowed versions
        if: matrix.lowest
        run: composer update statamic/cms --prefer-lowest --with-all-dependencies --no-interaction --no-progress

      - name: Show the resolved statamic/cms
        run: composer show statamic/cms | grep -E '^(name|versions)'

      - run: composer stan
      - run: composer test

  # The aggregate a ruleset requires; see THE `CI` AGGREGATE in the header. `always()` runs it
  # when a needed job failed, so it reports a failure rather than staying pending.
  ci:
    name: CI
    needs: [checks, decision-log, scripts, built-assets, parallel-safe, compatibility]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list (an emptied `needs:`, a dropped `env:`) would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
